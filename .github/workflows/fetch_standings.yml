name: Fetch Brasileirão Standings

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Scrape standings from CBF
        run: |
          python3 - <<'EOF'
          import urllib.request
          import re
          import json
          from datetime import datetime, timezone

          url = "https://www.cbf.com.br/futebol-brasileiro/tabelas/campeonato-brasileiro/serie-a/2026"

          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (compatible; standings-bot/1.0)"
          })

          with urllib.request.urlopen(req, timeout=15) as resp:
              html = resp.read().decode("utf-8")

          # Extract rows from the standings table
          # Each team row has: position, team name, PTS, J, V, E, D, GP, GC, SG, CA, CV, %
          pattern = re.compile(
              r'<strong>(\d+)</strong>.*?'           # position
              r'href="[^"]+/(\d+)"[^>]*>\s*([^<]+?)\s*</a>.*?'  # team url id + name
              r'<td[^>]*>\s*(\d+)\s*</td>'           # PTS
              r'.*?<td[^>]*>\s*(\d+)\s*</td>'        # J
              r'.*?<td[^>]*>\s*(\d+)\s*</td>'        # V
              r'.*?<td[^>]*>\s*(\d+)\s*</td>'        # E
              r'.*?<td[^>]*>\s*(\d+)\s*</td>'        # D
              r'.*?<td[^>]*>\s*(\d+)\s*</td>'        # GP
              r'.*?<td[^>]*>\s*(\d+)\s*</td>'        # GC
              r'.*?<td[^>]*>\s*(-?\d+)\s*</td>'      # SG
              r'.*?<td[^>]*>\s*(\d+)\s*</td>'        # CA
              r'.*?<td[^>]*>\s*(\d+)\s*</td>'        # CV
              r'.*?<td[^>]*>\s*(\d+)\s*</td>',       # %
              re.DOTALL
          )

          standing = []
          for m in pattern.finditer(html):
              pos, team_id, name, pts, j, v, e, d, gp, gc, sg, ca, cv, aprov = m.groups()
              standing.append({
                  "rank":       int(pos),
                  "team":       name.strip(),
                  "team_id":    team_id,
                  "points":     int(pts),
                  "played":     int(j),
                  "win":        int(v),
                  "draw":       int(e),
                  "lose":       int(d),
                  "goals_for":  int(gp),
                  "goals_against": int(gc),
                  "goals_diff": int(sg),
                  "yellow":     int(ca),
                  "red":        int(cv),
                  "efficiency": int(aprov),
              })

          if len(standing) < 18:
              print(f"ERROR: Only {len(standing)} teams found — aborting to preserve existing data")
              exit(1)

          data = {
              "fetched_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source": "cbf.com.br",
              "season": 2026,
              "response": {
                  "standing": standing
              }
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f"OK: {len(standing)} teams written to data.json")
          EOF

      - name: Commit updated standings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet \
            && echo "No changes to commit" \
            || git commit -m "chore: update standings $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git push
